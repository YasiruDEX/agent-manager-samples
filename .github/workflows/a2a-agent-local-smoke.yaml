name: A2A Local Smoke Checks
on:
  pull_request:
    paths:
      - 'a2a-agent/**'
      - '.github/workflows/a2a-agent-local-smoke.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a2a-agent-local-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: A2A local smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies and run HTTP smoke
        env:
          PYTHON: python
        run: bash a2a-agent/scripts/smoke_test.sh --reports "$RUNNER_TEMP/smoke-reports"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-smoke-a2a-agent
          path: ${{ runner.temp }}/smoke-reports/
